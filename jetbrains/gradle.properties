pluginVersion=0.0.1
# IDE the plugin is compiled against: a local installation (platformLocalPath), or CLion of this version.
platformVersion=2026.2.3
platformLocalPath=
lsp4ijVersion=0.21.0
# GitHub repository (owner/name) whose releases provide the standalone server for users without Node.js.
# GITHUB_REPOSITORY (set by GitHub Actions) takes precedence, so forks release against their own repository.
githubRepository=SnowyWhite/GSCLSP

org.gradle.configuration-cache=true
kotlin.stdlib.default.dependency=false
